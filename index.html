<!-- TELA PRINCIPAL (CARTEIRA ESTILO PASSE CASSINO) -->
<div id="screen-main" class="hidden">
    
    <div id="feedback-msg"></div>

    <!-- MOLDURA DA CREDENCIAL -->
    <div class="casino-card-frame">
        <div class="casino-card-inner">
            <div class="watermark-bg">Cassino</div>

            <!-- COLUNA ESQUERDA: AVATAR, NOME E ESTRELAS -->
            <div class="card-left">
                <div class="avatar-photo-frame">
                    <div id="wallet-avatar-display" class="avatar-photo">👦</div>
                </div>
                <div class="player-name-badge">
                    <span id="wallet-name">NOME DO USUÁRIO</span>
                </div>
                <div class="card-stars">✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦</div>
            </div>

            <!-- COLUNA DIREITA: DADOS DO JOGADOR -->
            <div class="card-right">
                <h2 id="wallet-profile" class="card-profile-title">PERFIL DO JOGADOR</h2>

                <div class="card-data-row">
                    <span class="data-label">ID Jogador:</span>
                    <strong id="wallet-id" class="data-value">#000000</strong>
                </div>

                <div class="card-data-row">
                    <span class="data-label">Dia/Hora:</span>
                    <span id="wallet-date" class="data-value">00/00/0000 00:00 AM</span>
                </div>

                <div class="card-data-row highlight-balance">
                    <span class="data-label">Saldo Total:</span>
                    <strong id="wallet-balance" class="data-value-balance">$ 0</strong>
                </div>

                <!-- ÍCONES DECORATIVOS -->
                <div class="card-stamps-row">
                    <span class="stamp-icon">🎯</span>
                    <span class="stamp-icon">🥁</span>
                    <span class="stamp-icon">🦁</span>
                    <span class="stamp-icon">☂️</span>
                    <span class="stamp-icon">🦀</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ABAS DA CARTEIRA -->
    <div class="tab-buttons">
        <button id="btn-tab-carteira" class="active">📜 Extrato</button>
        <button id="btn-tab-qrcode">📱 Meu QR Code</button>
    </div>

    <!-- EXTRATO DE MOVIMENTAÇÕES -->
    <div id="tab-carteira">
        <h4 style="margin: 15px 0 10px; color:#334155;">Histórico de Movimentações</h4>
        <div id="transaction-log" class="transaction-log"></div>
    </div>

    <!-- QR CODE DO JOGADOR -->
    <div id="tab-qrcode" class="hidden" style="text-align: center; padding: 20px 0;">
        <p style="color:#64748b; font-size:0.9rem;">Apresente este QR Code para receber recursos.</p>
        <div id="qrcode-player-display" style="margin: 15px auto;"></div>
    </div>

    <!-- BOTÃO PARA RESETAR -->
    <button id="btn-reset-app" class="btn-reset">
        🚪 Encerrar Sessão / Trocar de Jogador
    </button>
</div>
